services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  kafka:
    image: apache/kafka:latest
    ports:
      - "127.0.0.1:9092:9092"

volumes:
  postgres_data:
  kafka_data: