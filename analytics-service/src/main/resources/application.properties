spring.application.name = analytics-service

spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/master.yaml

spring.datasource.url=jdbc:clickhouse://localhost:8123/analytics
spring.datasource.username=analytics
spring.datasource.password=root

analytics.shedlock.datasource.url = jdbc:postgresql://localhost:5433/analytics_locks
analytics.shedlock.datasource.username = shedlock
analytics.shedlock.datasource.password = root

lockAtLeast = PT5M
lockAtMostFor = PT15M

server.port=8081

analytics.statistics.refresh-delay = PT5M

analytics.kafkaconfig.interval-param = 2000
analytics.kafkaconfig.maxattempts-param = 4

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer = org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class = org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type = lmncrt.analyticsservice.dto.OrderEventDto
spring.kafka.consumer.group-id = analytics-service
spring.kafka.consumer.auto-offset-reset = earliest
spring.kafka.consumer.enable-auto-commit = false
spring.kafka.listener.ack-mode = manual_immediate

logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.apache.kafka.clients.admin.internals.AdminMetadataManager=WARN