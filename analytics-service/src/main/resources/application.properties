spring.application.name = analytics-service

spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/master.yaml

spring.datasource.url=jdbc:clickhouse://localhost:8123/analytics
spring.datasource.username=analytics
spring.datasource.password=root

server.port=8081

analytics.statistics.refresh-delay = PT5M

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id = analytics-service
spring.kafka.consumer.auto-offset-reset = earliest

logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.apache.kafka.clients.admin.internals.AdminMetadataManager=WARN